<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">AI Character Galaxy</title>
  <description id="description">An evidence-grounded learning galaxy for history and literature.</description>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B3E"/>
      <stop offset="0.48" stop-color="#070811"/>
      <stop offset="1" stop-color="#150B28"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 174) rotate(140) scale(310 280)">
      <stop stop-color="#4AABFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4AABFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 470) rotate(-35) scale(330 230)">
      <stop stop-color="#9B6CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9B6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="620" y1="105" x2="1110" y2="545" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.14"/>
      <stop offset="1" stop-color="white" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="orbit" x1="700" y1="165" x2="1050" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8FD2FF"/>
      <stop offset="1" stop-color="#AB82FF"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#00020A" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <rect width="1200" height="630" rx="36" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" rx="36" fill="url(#violetGlow)"/>

  <g fill="#D6EBFF">
    <circle cx="74" cy="82" r="2" opacity="0.5"/><circle cx="184" cy="42" r="1.5" opacity="0.35"/>
    <circle cx="356" cy="86" r="1" opacity="0.42"/><circle cx="520" cy="55" r="2" opacity="0.32"/>
    <circle cx="1068" cy="74" r="1.5" opacity="0.55"/><circle cx="1140" cy="176" r="1" opacity="0.42"/>
    <circle cx="94" cy="518" r="1.5" opacity="0.3"/><circle cx="436" cy="560" r="1" opacity="0.4"/>
    <circle cx="1104" cy="548" r="2" opacity="0.36"/><circle cx="558" cy="392" r="1.5" opacity="0.28"/>
  </g>

  <g transform="translate(72 62)">
    <ellipse cx="26" cy="26" rx="25" ry="11" transform="rotate(-24 26 26)" stroke="#9AD8FF" stroke-width="3"/>
    <circle cx="27" cy="26" r="7" fill="#F3C969"/>
    <circle cx="5" cy="34" r="3" fill="#B88AFF"/>
    <text x="68" y="34" fill="#F7FAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700" letter-spacing="-0.6">AI Character Galaxy</text>
  </g>

  <g transform="translate(72 172)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" fill="#9FD7FF" font-size="17" font-weight="700" letter-spacing="3.5">EVIDENCE-GROUNDED LEARNING</text>
    <text x="0" y="70" fill="#F7FAFF" font-size="62" font-weight="760" letter-spacing="-3.2">Explore why</text>
    <text x="0" y="134" fill="#F7FAFF" font-size="62" font-weight="760" letter-spacing="-3.2">relationships mattered.</text>
    <text x="0" y="188" fill="#B8C3DC" font-size="23" font-weight="450">History and literature become a universe of</text>
    <text x="0" y="222" fill="#B8C3DC" font-size="23" font-weight="450">people, evidence, choices, and consequences.</text>
    <g transform="translate(0 276)">
      <rect width="235" height="54" rx="27" fill="#F3F7FF"/>
      <text x="28" y="35" fill="#0A1020" font-size="18" font-weight="750">OpenAI Build Week</text>
      <rect x="248" width="144" height="54" rx="27" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14"/>
      <text x="283" y="35" fill="#DCE8FF" font-size="18" font-weight="700">Education</text>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="660" y="105" width="466" height="438" rx="42" fill="url(#glass)" stroke="white" stroke-opacity="0.16"/>
  </g>
  <g opacity="0.66" stroke-linecap="round">
    <path d="M744 275L861 194L1008 252L952 403L802 449L744 275Z" stroke="#77C5FF" stroke-width="2"/>
    <path d="M744 275L952 403M861 194L802 449M1008 252L802 449" stroke="#A787FF" stroke-width="1.5" stroke-dasharray="7 9"/>
  </g>
  <g filter="url(#softGlow)" opacity="0.8">
    <circle cx="744" cy="275" r="32" fill="#63B9FF"/><circle cx="861" cy="194" r="28" fill="#A074FF"/>
    <circle cx="1008" cy="252" r="34" fill="#F1C566"/><circle cx="952" cy="403" r="30" fill="#FF7B91"/>
    <circle cx="802" cy="449" r="26" fill="#73DFC5"/>
  </g>
  <g stroke="url(#orbit)" stroke-width="4">
    <circle cx="744" cy="275" r="24" fill="#142C4D"/><circle cx="861" cy="194" r="20" fill="#2D1A54"/>
    <circle cx="1008" cy="252" r="25" fill="#493C19"/><circle cx="952" cy="403" r="22" fill="#4A1E31"/>
    <circle cx="802" cy="449" r="19" fill="#153F3C"/>
  </g>
  <g fill="#F7FAFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">
    <text x="744" y="280" font-size="16">R</text><text x="861" y="199" font-size="14">I</text>
    <text x="1008" y="258" font-size="16">C</text><text x="952" y="409" font-size="15">F</text>
    <text x="802" y="454" font-size="13">E</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="704" y="494" width="376" height="1" fill="white" fill-opacity="0.13"/>
    <text x="704" y="524" fill="#AFC0DB" font-size="16">GPT-5.6 guidance · reviewed evidence · offline path</text>
  </g>
</svg>
